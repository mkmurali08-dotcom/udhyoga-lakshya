function esc(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function snippet(item, query){
  let text = item.text || '';

  // Remove repeated website/navigation boilerplate from displayed snippets only.
  text = text
    .replace(/⭐\s*Welcome to Udhyoga Lakshya\s*/gi, '')
    .replace(/Udhyoga Lakshya\s+Your Path to the Right Job\s*/gi, '')
    .replace(/HOME\s+GOVT\.\s*JOBS\s+EXAMS\s+RESULTS\s+ADMIT CARDS\s*/gi, '')
    .replace(/←\s*Back to (?:Home|Government Jobs|All Government Jobs)\s*/gi, '')
    .replace(/\s+/g, ' ')
    .trim();

  const lower=text.toLowerCase(), q=query.toLowerCase(), pos=lower.indexOf(q);

  if(pos>=0){
    const start=Math.max(0,pos-70), end=Math.min(text.length,pos+query.length+150);
    return (start?'…':'')+text.slice(start,end)+(end<text.length?'…':'');
  }

  return text.slice(0,220)+(text.length>220?'…':'');
}
function runSearch(query, updateUrl=true){
  query=query.trim(); results.innerHTML='';
  if(updateUrl) history.replaceState(null,'',query?'search.html?q='+encodeURIComponent(query):'search.html');
  if(!query){summary.textContent='Enter a job, exam, state, department or recruitment name to search.';return;}
  const q=query.toLowerCase(), words=q.split(/\s+/).filter(Boolean);
  const matches=SEARCH_DATA.map(item=>{
    const hay=(item.title+' '+item.text).toLowerCase(); let score=0;
    if(hay.includes(q)) score+=100;
    words.forEach(w=>{if(hay.includes(w)) score+=15;});
    if(item.title.toLowerCase().includes(q)) score+=80;
    return {item,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score || a.item.title.localeCompare(b.item.title));
  summary.textContent=matches.length ? matches.length+' result'+(matches.length===1?'':'s')+' found for “'+query+'”.' : 'No matching result found for “'+query+'”. Try a job name, exam name, state, department or authority.';
  if(!matches.length){results.innerHTML='<div class="empty">No result found yet. The search checks the pages currently present in this website.</div>';return;}
  matches.forEach(({item})=>{
    const card=document.createElement('article'); card.className='result';
    card.innerHTML='<h2>'+esc(item.title)+'</h2><p>'+esc(snippet(item,query))+'</p><a href="'+esc(item.url)+'">Open Result →</a>';
    results.appendChild(card);
  });
}
form.addEventListener('submit',e=>{e.preventDefault();runSearch(input.value,true);});

fetch("notifications.json?v=" + Date.now(), {cache:"no-store"})
  .then(r => r.ok ? r.json() : [])
  .then(rows => {
    if (!Array.isArray(rows)) return;

    rows.forEach(r => {
      const title = String(r.title || "").trim();
      if (!title) return;

      const text = [
        r.title,
        r.department,
        r.organization,
        r.state,
        r.post,
        r.date,
        r.lastDate,
        r.category,
        r.description
      ].filter(v => String(v || "").trim())
       .map(v => String(v).trim())
       .join(" ");

      const url = String(r.url || r.link || r.applyUrl || "").trim();

      SEARCH_INDEX.push({
        title: title,
        text: text,
        url: url || "#"
      });
    });

    if (initialQuery) {
      runSearch(initialQuery, false);
    } else {
      runSearch("", false);
    }
  })
  .catch(() => {});

if(initialQuery){input.value=initialQuery;runSearch(initialQuery,false);}else{runSearch('',false);}
</script>

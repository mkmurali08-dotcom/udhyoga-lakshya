name: Sync Google Sheet Notifications

on:
  push:
    branches:
      - main
    paths:
      - "sheet-notifications.js"
      - ".github/workflows/sync-google-sheet.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: sync-google-sheet
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download published Google Sheet
        shell: bash
        run: |
          set -e

          SHEET_ID="1HLCzR_CwklTB6DY_XCp0XqHTBFf_lk5vWT--2-jdOK0"

          curl -fL --retry 3 --retry-all-errors --silent --show-error             -A "Mozilla/5.0"             "https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=final"             -o /tmp/udhyoga-sheet.csv

          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("/tmp/udhyoga-sheet.csv")
          with path.open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.reader(f))

          if not rows:
              raise SystemExit("ERROR: Published Google Sheet CSV is empty.")

          required = [
              "Type",
              "State",
              "Title",
              "Application Start",
              "Application End",
              "Exam date",
              "Edit / Correction",
              "Official Link",
              "Apply Link",
              "Status",
          ]

          # Some published-sheet responses merge the first row's values into
          # the header text (for example, "Type Results" or "Status Live").
          # Split only known header prefixes and restore those values as row 1.
          raw_first = [str(x or "").strip() for x in rows[0]]
          headers = []
          recovered = [""] * len(raw_first)
          matched = 0

          for i, cell in enumerate(raw_first):
              match = next(
                  (h for h in sorted(required, key=len, reverse=True)
                   if cell == h or cell.startswith(h + " ")),
                  None
              )
              if match:
                  headers.append(match)
                  matched += 1
                  if cell != match:
                      recovered[i] = cell[len(match):].strip()
              else:
                  headers.append(cell or f"_extra_{i}")

          missing = set(required) - set(headers)
          has_recovered_values = any(recovered)

          if missing and matched >= len(required) - 2:
              raise SystemExit(
                  f"ERROR: Could not safely recover required Sheet headers: {sorted(missing)}. "
                  f"Received first row: {raw_first}"
              )

          if has_recovered_values and not missing:
              rows = [headers, recovered] + rows[1:]
              with path.open("w", encoding="utf-8", newline="") as f:
                  csv.writer(f).writerows(rows)
              print("Recovered header/value overlap in published Sheet response.")
          else:
              # Do not rewrite a normal CSV. Fail clearly if the header is not valid.
              if missing:
                  raise SystemExit(
                      f"ERROR: Required Google Sheet headers missing: {sorted(missing)}. "
                      f"Got: {headers}"
                  )

          print("Google Sheet downloaded successfully.")
          print("Headers:", headers)
          PY

      - name: Build notifications.json
        run: |
          python - <<'PY'
          import csv,json,re
          from datetime import datetime,timedelta,date
          from pathlib import Path

          out=Path("notifications.json")
          now=datetime.now()
          old=[]

          if out.exists():
              try:
                  old=json.loads(out.read_text(encoding="utf-8"))
                  old=old if isinstance(old,list) else []
              except Exception:
                  old=[]

          def norm(v):
              return " ".join(str(v or "").strip().lower().split())

          def identity(x):
              return (
                  "row",
                  norm(x.get("type")),
                  norm(x.get("state")),
                  norm(x.get("title")),
                  str(x.get("officialLink", "") or "").strip().rstrip("/").lower()
              )

          by={}
          for x in old:
              if isinstance(x,dict):
                  by[identity(x)]=x

          def val(r,*names):
              for n in names:
                  v=(r.get(n) or "").strip()
                  if v:
                      return v
              return ""

          def parse_date(v):
              s=str(v or "").strip()
              if not s:
                  return None
              for fmt in (
                  "%d/%m/%Y", "%d-%m-%Y", "%Y-%m-%d",
                  "%d/%m/%y", "%d-%m-%y", "%d %b %Y",
                  "%d %B %Y", "%b %d, %Y", "%B %d, %Y"
              ):
                  try:
                      return datetime.strptime(s,fmt).date()
                  except ValueError:
                      pass
              return None

          now_iso=now.astimezone().isoformat(timespec="seconds")
          today=now.date()
          output=[]

          with open("/tmp/udhyoga-sheet.csv",encoding="utf-8-sig",newline="") as f:
              for raw in csv.DictReader(f):
                  r={
                      str(k).strip():(v or "").strip()
                      for k,v in raw.items()
                      if k is not None
                  }

                  title=r.get("Title","")
                  state=r.get("State","")
                  if not title or not state:
                      continue

                  official=r.get("Official Link","")
                  ident=(
                      "row",
                      norm(r.get("Type")),
                      norm(state),
                      norm(title),
                      official.strip().rstrip("/").lower()
                  )
                  prev=by.get(ident)

                  start=val(r,"Application Start","Start","applicationStart")
                  end=val(r,"Application End","End","applicationEnd")
                  exam_date=val(r,"Exam date","Exam Date","examDate","exam_date")
                  edit_correction=val(r,"Edit / Correction","Edit/Correction","Edit Correction","editCorrection","edit_correction")
                  display_date=val(r,"Date","date") or end or start
                  status=val(r,"Status")

                  content={
                      "type":r.get("Type",""),
                      "state":state,
                      "category":r.get("Category","") or r.get("Type",""),
                      "title":title,
                      "applicationStart":start,
                      "applicationEnd":end,
                      "examDate":exam_date,
                      "editCorrection":edit_correction,
                      "date":display_date,
                      "officialLink":official,
                      "applyLink":r.get("Apply Link",""),
                      "status":status
                  }
                  signature=json.dumps(content,ensure_ascii=False,sort_keys=True,separators=(",",":"))

                  first=(str(prev.get("firstSeen")) if prev and prev.get("firstSeen") else now_iso)
                  old_signature=prev.get("contentSignature") if prev else None
                  if prev:
                      if not old_signature:
                          old_content={k:prev.get(k,"") or "" for k in content}
                          old_signature=json.dumps(old_content,ensure_ascii=False,sort_keys=True,separators=(",",":"))
                      changed=(old_signature != signature)
                      last_updated=(now_iso if changed else str(prev.get("lastUpdated") or prev.get("firstSeen") or first))
                  else:
                      last_updated=now_iso

                  status_closed=bool(__import__("re").search(r"\b(closed|expired|over|ended)\b",status,re.I))
                  end_date=parse_date(end)
                  expired=bool(end_date and end_date < today)
                  try:
                      first_dt=datetime.fromisoformat(first.replace("Z","+00:00"))
                      if first_dt.tzinfo:
                          age=(now.astimezone(first_dt.tzinfo)-first_dt).total_seconds()
                      else:
                          age=(now-first_dt).total_seconds()
                      is_new=(0 <= age < 7*86400) and not status_closed and not expired
                  except Exception:
                      is_new=(not status_closed and not expired and not prev)

                  output.append({
                      "_identity":list(ident),
                      **content,
                      "firstSeen":first,
                      "lastUpdated":last_updated,
                      "contentSignature":signature,
                      "isNew":is_new
                  })

          out.write_text(
              json.dumps(output,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )

          print(f"Wrote {len(output)} notifications to notifications.json")
          PY


      - name: Pre-render notification pages for crawlers
        shell: bash
        run: |
          python - <<'PY'
          import html
          import json
          import re
          from pathlib import Path
          from datetime import datetime
          from urllib.parse import quote

          DATA = json.loads(Path("notifications.json").read_text(encoding="utf-8"))
          if not isinstance(DATA, list):
              raise SystemExit("notifications.json is not a list.")

          def norm(v):
              return re.sub(r"\s+", " ", str(v or "").strip()).lower()

          def first_seen_time(row):
              raw = str(row.get("lastUpdated") or row.get("firstSeen") or "").strip()
              if not raw:
                  return 0.0
              try:
                  return datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp()
              except Exception:
                  try:
                      return datetime.strptime(raw[:10], "%Y-%m-%d").timestamp()
                  except Exception:
                      return 0.0

          def parse_date(v):
              s = str(v or "").strip()
              if not s:
                  return 0.0
              for fmt in ("%d/%m/%Y", "%d-%m-%Y", "%Y-%m-%d"):
                  try:
                      return datetime.strptime(s, fmt).timestamp()
                  except Exception:
                      pass
              return 0.0

          def blob(r):
              return " ".join([
                  norm(r.get("type")),
                  norm(r.get("category")),
                  norm(r.get("title")),
                  norm(r.get("status"))
              ])

          def is_result(r):
              return bool(re.search(
                  r"result|admit\s*card|answer\s*key|selection|allocation|call\s*letter|"
                  r"hall\s*ticket|e-admit|ecall|ranked\s*list",
                  blob(r), re.I
              ))

          def is_live_or_open(r):
              return bool(re.search(
                  r"\b(open|live|active|apply|applications?\s+open|accepting\s+applications?)\b",
                  norm(r.get("status")), re.I
              ))

          def is_upcoming_status(r):
              return bool(re.search(
                  r"\b(upcoming|scheduled|tentative|calendar|to\s*be\s*held|forthcoming)\b",
                  norm(r.get("status")), re.I
              ))

          def is_special_latest(r):
              return bool(re.search(
                  r"\b(extended|closing\s*soon)\b",
                  norm(r.get("status")), re.I
              ))

          def category(r):
              if is_special_latest(r):
                  return "latest-notifications"
              if is_result(r):
                  return "results-admit-cards"
              if is_live_or_open(r):
                  return "latest-notifications"
              if is_upcoming_status(r):
                  return "upcoming-exams"
              pc = norm(r.get("portal_category"))
              if pc in {"latest-notifications", "upcoming-exams", "results-admit-cards"}:
                  return pc
              t = norm(r.get("type"))
              b = blob(r)
              if t == "exam" or re.search(r"upcoming exam|exam calendar|scheduled exam", b, re.I):
                  return "upcoming-exams"
              if t == "job" or re.search(r"job|recruitment|vacanc|application|engagement|hiring|notification", b, re.I):
                  return "latest-notifications"
              return "latest-notifications"

          def display_date(r):
              s = str(r.get("applicationStart") or r.get("start") or "").strip()
              e = str(r.get("applicationEnd") or r.get("end") or "").strip()
              ex = str(r.get("examDate") or "").strip()
              ec = str(r.get("editCorrection") or "").strip()
              if s and e and s != e:
                  return f"{s} – {e}"
              if e or s:
                  return e or s
              if ex:
                  return f"Exam Date: {ex}"
              if ec:
                  return f"Edit / Correction: {ec}"
              return str(r.get("date") or "").strip()

          def status_label(r):
              b = blob(r)
              s = norm(r.get("status"))
              if is_result(r):
                  if re.search(r"admit\s*card|call\s*letter|hall\s*ticket|e-admit|ecall", b, re.I):
                      return "Admit Card", "status-admit"
                  if re.search(r"answer\s*key", b, re.I):
                      return "Answer Key", "status-result"
                  if re.search(r"selection|allocation", b, re.I):
                      return "Selection Update", "status-result"
                  return "Result", "status-result"
              if re.search(r"live|active", s, re.I):
                  return "Live", "status-live"
              if re.search(r"open|apply", s, re.I):
                  return "Open", "status-open"
              if is_upcoming_status(r):
                  return "Upcoming", "status-upcoming"
              if re.search(r"closed|expired|over", s, re.I):
                  return "Closed", "status-closed"
              return (str(r.get("status") or "Open"), "status-open")

          def row_html(r):
              title = html.escape(str(r.get("title") or "Notification"))
              state = html.escape(str(r.get("state") or ""))
              typ = html.escape(str(r.get("type") or "Notification"))
              cat = html.escape(str(r.get("category") or ""))
              date = html.escape(display_date(r))
              detail = "job-detail.html?title=" + quote(
                  str(r.get("title") or ""), safe=""
              )
              label, cls = status_label(r)

              meta = [
                  f'<span>{typ}</span>',
                  f'<span>{state}</span>',
              ]
              if cat:
                  meta.append(f'<span>{cat}</span>')
              if date:
                  meta.append(f'<span>{date}</span>')
              meta.append(f'<span class="{cls}">{html.escape(label)}</span>')
              if bool(r.get("isNew")):
                  meta.append('<span class="status-live">NEW</span>')

              return (
                  '<article class="notice-item">'
                  '<div class="notice-main">'
                  f'<h2><a href="{html.escape(detail)}">{title}</a></h2>'
                  f'<div class="meta">{"".join(meta)}</div>'
                  '</div>'
                  f'<a class="details" href="{html.escape(detail)}">View Details →</a>'
                  '</article>'
              )

          def render_page(filename, page_key):
              rows = [r for r in DATA if category(r) == page_key]
              rows.sort(key=lambda r: (first_seen_time(r), parse_date(r.get("date"))), reverse=True)

              path = Path(filename)
              source = path.read_text(encoding="utf-8")

              count_text = f"{len(rows)} notifications"
              list_html = "".join(row_html(r) for r in rows)
              if not list_html:
                  list_html = '<div class="empty">No notifications available in this category.</div>'

              source, n1 = re.subn(
                  r'(<span id="count">).*?(</span>)',
                  lambda m: m.group(1) + count_text + m.group(2),
                  source,
                  count=1,
                  flags=re.S
              )
              if n1 != 1:
                  raise SystemExit(f"{filename}: count placeholder not found.")

              source, n2 = re.subn(
                  r'(<section id="list">).*?(</section>)',
                  lambda m: m.group(1) + list_html + m.group(2),
                  source,
                  count=1,
                  flags=re.S
              )
              if n2 != 1:
                  raise SystemExit(f"{filename}: list placeholder not found.")

              path.write_text(source, encoding="utf-8")
              print(f"Pre-rendered {filename}: {len(rows)} notifications")

          render_page("latest-notifications.html", "latest-notifications")
          render_page("upcoming-exams.html", "upcoming-exams")
          render_page("results-admit-cards.html", "results-admit-cards")
          PY

      - name: Commit and push changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage every file this workflow intentionally generates. The crawler
          # pre-render step also updates these HTML files; leaving them unstaged
          # makes git rebase fail with "You have unstaged changes".
          git add \
            notifications.json \
            latest-notifications.html \
            upcoming-exams.html \
            results-admit-cards.html

          if git diff --cached --quiet; then
            echo "No notification changes."
            exit 0
          fi

          git commit -m "Sync Google Sheet notifications"

          # The AI workflow can update the same main branch while this job is running.
          # Rebase our new notification commit on top of the latest remote main instead
          # of failing with "fetch first".
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt/5"

            git fetch origin main

            if ! git rebase -X theirs origin/main; then
              echo "ERROR: Rebase conflict detected. No force push will be attempted."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Google Sheet notifications pushed successfully."
              exit 0
            fi

            echo "Remote main changed during push; retrying..."
            sleep 3
          done

          echo "ERROR: Could not push notifications.json after 5 attempts."
          exit 1

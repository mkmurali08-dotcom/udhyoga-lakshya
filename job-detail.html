<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details | Udhyoga Lakshya</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f6;color:#111;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1000px;margin:30px auto;padding:0 20px}.head{background:#080808;color:#fff;border-radius:14px 14px 0 0;padding:28px}.head h1{margin:0;font-size:27px}.head p{color:#bbb;font-size:12px}.content{background:#fff;padding:25px;border-radius:0 0 14px 14px;box-shadow:0 6px 25px rgba(0,0,0,.08)}
.notice{padding:13px;background:#fff8d9;border-left:4px solid #ffc400;font-size:12px;line-height:1.6}
table{width:100%;border-collapse:collapse;margin-top:20px}td{padding:12px;border-bottom:1px solid #eee;font-size:12px;vertical-align:top}td:first-child{width:30%;font-weight:900}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions a{padding:11px 17px;border-radius:7px;text-decoration:none;font-weight:900;font-size:12px}.apply{background:#ed1111;color:#fff}.official{background:#ffc400;color:#111}.back{display:inline-block;margin-top:20px;color:#ed1111;text-decoration:none;font-weight:800;font-size:12px}
.loading{padding:20px 0;font-size:12px}.error{padding:13px;background:#ffe5e5;border-left:4px solid #ed1111;font-size:12px;line-height:1.6}ul{margin:0;padding-left:18px}li{margin:4px 0}.subtable{margin-top:0}.subtable td:first-child{width:auto;font-weight:normal}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><h1 id="pageTitle">Job Details</h1><p id="pageSubtitle">Official-source-first information layout</p></header>
<section class="content">
<div class="notice"><strong>Important:</strong> Recruitment details can change. Verify the latest notification, eligibility, dates, fee and application instructions on the official recruitment portal before applying.</div>
<div id="status" class="loading">Loading notification details…</div>
<div id="details"></div>
<a class="back" href="govt-jobs.html">← Back to Government Jobs</a>
</section>
</main>
<script>
const labels={organization:"Organization",advertisement_number:"Advertisement Number",post_names:"Post Names",total_vacancies:"Total Vacancies",vacancy_breakdown:"Vacancy Breakdown",job_location:"Job Location",educational_qualification:"Educational Qualification",other_eligibility:"Other Eligibility",age_limit:"Age Limit",age_relaxation:"Age Relaxation",application_fee:"Application Fee",application_start:"Application Start",application_end:"Application End",exam_date:"Exam Date",selection_process:"Selection Process",exam_pattern:"Exam Pattern",syllabus:"Syllabus",documents_required:"Documents Required",salary_pay_scale:"Salary / Pay Scale",important_instructions:"Important Instructions",official_notification_url:"Official Notification",apply_url:"Apply Link",title:"Recruitment",type:"Type",state:"State",status:"Status"};
const fallback={title:"Telangana Police Recruitment 2026",organization:"Telangana Police Recruitment Board",post_names:["SI, PC & related posts"],status:"Active recruitment window",total_vacancies:"Use the latest official notification for the post-wise vacancy breakup.",application_start:"Check the official recruitment notice for the current application schedule.",application_end:"Check the official recruitment notice for the current application schedule.",other_eligibility:["Post-wise educational qualification and other eligibility conditions must be taken from the official notification."],age_limit:"Refer to the official notification for post-wise age criteria and relaxations.",age_relaxation:[],application_fee:"Refer to the official notification.",selection_process:["Refer to the official recruitment notification for the applicable selection stages."],salary_pay_scale:"Refer to the official notification for the applicable post-wise pay details.",official_notification_url:"https://www.tgprb.in/",apply_url:"https://www.tgprb.in/",type:"Job",state:"Telangana"};
function label(k){return labels[k]||k.replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase())}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function value(v){if(v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length))return "Not mentioned in the official notification";if(Array.isArray(v))return "<ul>"+v.map(x=>"<li>"+(typeof x==="object"?object(x):esc(x))+"</li>").join("")+"</ul>";if(typeof v==="object")return object(v);return esc(v).replace(/\n/g,"<br>")}
function object(o){return "<table class='subtable'>"+Object.entries(o).map(([k,v])=>"<tr><td><strong>"+esc(label(k))+"</strong></td><td>"+value(v)+"</td></tr>").join("")+"</table>"}
function requested(data){const p=new URLSearchParams(location.search), q=p.get("job")||p.get("key")||p.get("id");if(q&&data[q])return data[q];const t=p.get("title");if(t){const k=Object.keys(data).find(k=>String(data[k]?.title||"").toLowerCase()===t.toLowerCase());if(k)return data[k]}const k=Object.keys(data).find(k=>String(data[k]?.title||"").toLowerCase().includes("telangana police"));return k?data[k]:fallback}
function render(d){document.getElementById("pageTitle").textContent=d.title||"Job Details";document.getElementById("pageSubtitle").textContent=(d.organization||"Official-source-first")+" — official notification details";const skip=["title","type","state","status","official_notification_url","apply_url"];let rows="";Object.entries(d).forEach(([k,v])=>{if(!skip.includes(k))rows+="<tr><td>"+esc(label(k))+"</td><td>"+value(v)+"</td></tr>"});let a="";if(d.official_notification_url)a+='<a class="official" href="'+esc(d.official_notification_url)+'" target="_blank" rel="noopener">Official Notification / Portal</a>';if(d.apply_url)a+='<a class="apply" href="'+esc(d.apply_url)+'" target="_blank" rel="noopener">Apply / Check Status</a>';document.getElementById("details").innerHTML="<table>"+rows+"</table><div class='actions'>"+a+"</div>";document.getElementById("status").remove()}
fetch("job-details.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>render(requested(data))).catch(()=>{document.getElementById("status").outerHTML='<div class="error"><strong>Notification details could not be loaded.</strong><br>Please open the official notification and verify the latest details.</div>';render(fallback)})
</script>
</body>
</html>

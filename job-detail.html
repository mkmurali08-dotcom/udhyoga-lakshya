<!doctype html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Job Details | Udhyoga Lakshya</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f3f3;color:#151515;font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1120px;margin:28px auto;padding:0 18px}
.head{background:linear-gradient(135deg,#070707,#171717);color:#fff;border-radius:16px 16px 0 0;padding:30px 32px;border-bottom:5px solid #ffc400;box-shadow:0 7px 24px rgba(0,0,0,.12)}
.head h1{margin:0;font-size:30px;line-height:1.25;color:#fff}.head p{margin:9px 0 0;color:#d5d5d5;font-size:13px;line-height:1.5}
.content{background:#fff;padding:25px;border-radius:0 0 16px 16px;box-shadow:0 8px 28px rgba(0,0,0,.09)}
.notice{padding:15px 17px;background:#fff7d5;border:1px solid #f1d45d;border-left:5px solid #ffc400;border-radius:9px;font-size:13px;line-height:1.65;margin-bottom:22px}
.loading{padding:20px;text-align:center;font-size:13px;color:#666}.error{padding:14px;background:#ffe7e7;border:1px solid #efaaaa;border-left:5px solid #ed1111;border-radius:9px;font-size:13px;line-height:1.6}
.section{margin:0 0 24px}.section-title{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:11px 14px;background:#101010;color:#fff;border-radius:9px;border-left:5px solid #ffc400;font-size:17px}.section-title .num{color:#ffc400;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #e2e2e2;border-radius:9px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.035);min-width:0}.card.full{grid-column:1/-1}
.card-label{font-size:11px;text-transform:uppercase;letter-spacing:.45px;font-weight:900;color:#777;margin-bottom:7px}.card-value{font-size:13px;line-height:1.65;color:#161616;overflow-wrap:anywhere}.card.highlight{border-left:4px solid #ffc400;background:#fffdf4}.card.red{border-left:4px solid #ed1111}
ul{margin:0;padding-left:20px}li{margin:5px 0}
.mini-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}.mini{border:1px solid #e7e7e7;border-radius:7px;padding:9px 10px;background:#fafafa}.mini b{display:block;font-size:11px;color:#666;margin-bottom:3px}.mini span{font-size:13px;font-weight:700}
.vacancy-stream{border:1px solid #ddd;border-radius:10px;margin:0 0 12px;overflow:hidden;background:#fff}.stream-head{background:#111;color:#fff;padding:11px 13px;font-weight:900;font-size:13px;border-left:4px solid #ffc400}.stream-body{padding:11px}.stream-total{display:inline-block;background:#fff5c8;border:1px solid #f0d45e;border-radius:6px;padding:5px 9px;font-weight:900;font-size:12px;margin-bottom:9px}.vacancy-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.vacancy-cat{border:1px solid #e4e4e4;border-radius:7px;padding:8px;background:#fafafa}.vacancy-cat b{display:block;font-size:10px;color:#777}.vacancy-cat span{font-size:14px;font-weight:900}
.actions{display:flex;gap:11px;flex-wrap:wrap;margin:8px 0 4px}.actions a{padding:12px 18px;border-radius:8px;text-decoration:none;font-weight:900;font-size:13px;display:inline-block}.apply{background:#ed1111;color:#fff}.official{background:#ffc400;color:#111}.back{display:inline-block;margin-top:18px;color:#ed1111;text-decoration:none;font-weight:800;font-size:13px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.card.full{grid-column:auto}.vacancy-cats{grid-template-columns:repeat(2,minmax(0,1fr))}.head{padding:24px 20px}.head h1{font-size:23px}.content{padding:18px}.mini-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header class="head"><h1 id="pageTitle">Job Details</h1><p id="pageSubtitle">Official-source-first information layout</p></header>
<section class="content">
<div class="notice"><strong>Important:</strong> Recruitment details can change. Verify the latest notification, eligibility, dates, fee and application instructions on the official recruitment portal before applying.</div>
<div id="status" class="loading">Loading notification details…</div>
<div id="details"></div>
<a class="back" href="govt-jobs.html">← Back to Government Jobs</a>
</section>
</main>
<script>
const labels={organization:"Organization",advertisement_number:"Advertisement Number",post_names:"Post Names",total_vacancies:"Total Vacancies",vacancy_breakdown:"Vacancy Breakdown",job_location:"Job Location",educational_qualification:"Educational Qualification",other_eligibility:"Other Eligibility",age_limit:"Age Limit",age_relaxation:"Age Relaxation",application_fee:"Application Fee",application_start:"Application Start",application_end:"Application End",exam_date:"Exam Date",selection_process:"Selection Process",exam_pattern:"Exam Pattern",syllabus:"Syllabus",documents_required:"Documents Required",salary_pay_scale:"Salary / Pay Scale",important_instructions:"Important Instructions",official_notification_url:"Official Notification",apply_url:"Apply Link",title:"Recruitment",type:"Type",state:"State",status:"Status"};
const fallback={title:"Telangana Police Recruitment 2026",organization:"Telangana Police Recruitment Board",post_names:["SI, PC & related posts"],status:"Active recruitment window",total_vacancies:"Use the latest official notification for the post-wise vacancy breakup.",application_start:"Check the latest official recruitment notice.",application_end:"Check the latest official recruitment notice.",other_eligibility:["Refer to the official notification for post-wise eligibility."],age_limit:"Refer to the official notification.",age_relaxation:[],application_fee:"Refer to the official notification.",selection_process:["Refer to the official recruitment notification."],salary_pay_scale:"Refer to the official notification.",official_notification_url:"https://www.tgprb.in/",apply_url:"https://www.tgprb.in/",type:"Job",state:"Telangana"};
const groups=[
 {title:"Recruitment Overview",keys:["organization","advertisement_number","post_names","total_vacancies","job_location","status"]},
 {title:"Vacancy Details",keys:["vacancy_breakdown"]},
 {title:"Eligibility & Qualification",keys:["educational_qualification","other_eligibility","age_limit","age_relaxation"]},
 {title:"Application Details",keys:["application_start","application_end","application_fee"]},
 {title:"Exam & Selection",keys:["exam_date","selection_process","exam_pattern","syllabus"]},
 {title:"Salary & Important Information",keys:["salary_pay_scale","documents_required","important_instructions"]}
];
function label(k){return labels[k]||k.replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase())}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}
function list(v){return "<ul>"+v.map(x=>"<li>"+(typeof x==="object"?object(x):esc(x))+"</li>").join("")+"</ul>"}
function object(o){return "<div class='mini-grid'>"+Object.entries(o).map(([k,v])=>"<div class='mini'><b>"+esc(label(k))+"</b><span>"+value(v)+"</span></div>").join("")+"</div>"}
function value(v){if(v===null||v===undefined||v===""||(Array.isArray(v)&&!v.length))return "Not mentioned in the official notification";if(Array.isArray(v))return list(v);if(typeof v==="object")return object(v);return esc(v).replace(/\n/g,"<br>")}
function vacancyCard(stream){let entries=Object.entries(stream).filter(([k])=>k!=="stream"&&k!=="Stream");let name=stream.stream||stream.Stream||"Vacancy Details";let total=entries.find(([k])=>/total/i.test(k));let cats=entries.filter(([k])=>!/^total$/i.test(k));return "<div class='vacancy-stream'><div class='stream-head'>"+esc(name)+"</div><div class='stream-body'>"+(total?"<div class='stream-total'>Total: "+esc(total[1])+"</div>":"")+"<div class='vacancy-cats'>"+cats.map(([k,v])=>"<div class='vacancy-cat'><b>"+esc(label(k))+"</b><span>"+esc(v)+"</span></div>").join("")+"</div></div></div>"}
function vacancy(v){if(Array.isArray(v))return v.map(x=>typeof x==="object"?vacancyCard(x):"<div class='card'>"+esc(x)+"</div>").join("");return typeof v==="object"?vacancyCard(v):"<div class='card full'>"+value(v)+"</div>"}
function card(k,v){let cls=(k==="total_vacancies"||k==="advertisement_number")?"card highlight":"card";return "<div class='"+cls+"'><div class='card-label'>"+esc(label(k))+"</div><div class='card-value'>"+value(v)+"</div></div>"}
function requested(data){const p=new URLSearchParams(location.search),q=p.get("job")||p.get("key")||p.get("id");if(q&&data[q])return data[q];const t=p.get("title");if(t){const k=Object.keys(data).find(k=>String(data[k]?.title||"").toLowerCase()===t.toLowerCase());if(k)return data[k]}const k=Object.keys(data).find(k=>String(data[k]?.title||"").toLowerCase().includes("telangana police"));return k?data[k]:fallback}
function render(d){document.getElementById("pageTitle").textContent=d.title||"Job Details";document.getElementById("pageSubtitle").textContent=(d.organization||"Official-source-first")+" — official notification details";let used=new Set(["title","type","state","status","official_notification_url","apply_url"]);let html="";groups.forEach((g,i)=>{let keys=g.keys.filter(k=>d[k]!==undefined);if(!keys.length)return;html+="<section class='section'><h2 class='section-title'><span class='num'>"+String(i+1).padStart(2,"0")+"</span> "+g.title+"</h2>";if(g.keys.includes("vacancy_breakdown")){html+=vacancy(d.vacancy_breakdown)}else{html+="<div class='grid'>"+keys.map(k=>card(k,d[k])).join("")+"</div>"}html+="</section>";keys.forEach(k=>used.add(k))});let extra=Object.entries(d).filter(([k])=>!used.has(k));if(extra.length){html+="<section class='section'><h2 class='section-title'><span class='num'>07</span> Additional Details</h2><div class='grid'>"+extra.map(([k,v])=>card(k,v)).join("")+"</div></section>"}let a="";if(d.official_notification_url)a+='<a class="official" href="'+esc(d.official_notification_url)+'" target="_blank" rel="noopener">Official Notification / Portal ↗</a>';if(d.apply_url)a+='<a class="apply" href="'+esc(d.apply_url)+'" target="_blank" rel="noopener">Apply / Check Status ↗</a>';html+="<div class='actions'>"+a+"</div>";document.getElementById("details").innerHTML=html;document.getElementById("status").remove()}
const DATA_URLS=[
  "./job-details.json?cb="+Date.now(),
  "https://raw.githubusercontent.com/mkmurali08-dotcom/udhyoga-lakshya/main/job-details.json?cb="+Date.now(),
  "https://raw.githubusercontent.com/mkmurali08-dotcom/udhyoga-lakshya/main/job-details.json?cb="+Date.now()
];
async function loadDetails(){
  let lastError=null;
  for(const url of DATA_URLS){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),10000);
    try{
      const r=await fetch(url,{cache:"no-store",signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok) throw Error("HTTP "+r.status);
      const text=await r.text();
      const data=JSON.parse(text);
      if(!data || typeof data!=="object") throw Error("Invalid JSON");
      render(requested(data));
      return;
    }catch(err){
      clearTimeout(timer);
      lastError=err;
      console.warn("Could not load job details from",url,err);
    }
  }
  document.getElementById("status").outerHTML='<div class="error"><strong>Notification details could not be loaded.</strong><br>The job details data source is temporarily unavailable. Please refresh once.</div>';
  console.error(lastError);
}
loadDetails();
</script>
</body>
</html>
